openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: companies
    description: YC company profiles and moderation
  - name: rankings
    description: Community rating rankings
  - name: creator
    description: Company profile owner workspace
  - name: payments
    description: Paid ratings and receipts
  - name: battles
    description: Curated launch comparisons
  - name: perception
    description: Free community perception signals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [companies]
      summary: List published YC companies
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [trending, newest, community]
            default: trending
      responses:
        "200":
          description: YC companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [companies]
      summary: Submit a YC company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Submitted company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Sign in required
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [companies]
      summary: Get a YC company profile
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Company not found
  /products/{id}/status:
    patch:
      operationId: updateProductStatus
      tags: [companies]
      summary: Update company profile status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Sign in required
        "403":
          description: Not allowed
  /transactions:
    get:
      operationId: listTransactions
      tags: [payments]
      summary: List rating receipts and payment history
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          description: Sign in required
  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get payment state and receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paid rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Payment not found
  /battles:
    get:
      operationId: listBattles
      tags: [battles]
      summary: List launch comparisons
      responses:
        "200":
          description: Public battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Battle"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Submit a company battle for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleInput"
      responses:
        "201":
          description: Submitted battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSubmission"
        "401":
          description: Sign in required
  /battles/{slug}:
    get:
      operationId: getBattle
      tags: [battles]
      summary: Get a launch comparison
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Battle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
        "404":
          description: Battle not found
  /perception/sessions:
    post:
      operationId: createPerceptionSession
      tags: [perception]
      summary: Start an anonymous perception session
      responses:
        "201":
          description: New perception session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerceptionSession"
  /perception/swipes:
    post:
      operationId: recordPerceptionSwipe
      tags: [perception]
      summary: Record a free pairwise preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerceptionSwipeInput"
      responses:
        "201":
          description: Recorded preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerceptionSwipeResult"
        "400":
          description: Invalid preference
        "409":
          description: Duplicate request
        "429":
          description: Too many preferences in a short time
        "404":
          description: Launch comparison not found
  /perception/dna:
    post:
      operationId: getTasteDna
      tags: [perception]
      summary: Get a visitor's current taste DNA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerceptionSessionInput"
      responses:
        "200":
          description: Taste DNA summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasteDna"
        "404":
          description: Session not found
  /perception/companies/{slug}:
    get:
      operationId: getCompanyPerception
      tags: [perception]
      summary: Get a company perception profile
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Perception profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPerception"
        "404":
          description: Company not found
  /perception/words:
    post:
      operationId: createPerceptionWord
      tags: [perception]
      summary: Add a one-word reaction after meaningful participation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerceptionWordInput"
      responses:
        "201":
          description: Recorded word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerceptionWord"
        "400":
          description: Invalid or unavailable word
        "404":
          description: Session or company not found
  /perception/claims:
    post:
      operationId: createCompanyClaim
      tags: [perception, companies]
      summary: Request to claim a company perception page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyClaimInput"
      responses:
        "201":
          description: Claim request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyClaim"
        "401":
          description: Sign in required
        "404":
          description: Company not found
  /perception/map:
    get:
      operationId: getPerceptionMap
      tags: [perception]
      summary: List confidence-aware ecosystem map points
      responses:
        "200":
          description: Public ecosystem map points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerceptionMapPoint"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, slug, title, shortDescription, description, imageUrl, category, ycBatch, websiteUrl, location, creatorName, creatorId, voteCount, ratingAverage, totalRaised, status, featured, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        category: { type: string }
        ycBatch: { type: string }
        websiteUrl: { type: string }
        location: { type: string }
        creatorName: { type: string }
        creatorId: { type: string }
        voteCount: { type: integer }
        ratingAverage: { type: number }
        totalRaised: { type: number }
        status:
          type: string
          enum: [pending, published, paused, rejected]
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, shortDescription, description, imageUrl, category, ycBatch, websiteUrl, location]
      properties:
        title: { type: string, minLength: 3 }
        shortDescription: { type: string, minLength: 10 }
        description: { type: string, minLength: 20 }
        imageUrl: { type: string, format: uri }
        category: { type: string, minLength: 2 }
        ycBatch: { type: string, minLength: 2 }
        websiteUrl: { type: string, format: uri }
        location: { type: string, minLength: 2 }
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paused]
    Ranking:
      type: object
      required: [rank, product]
      properties:
        rank: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
    CreatorDashboard:
      type: object
      required: [totalVotes, totalRaised, publishedCount, pendingCount, products]
      properties:
        totalVotes: { type: integer }
        totalRaised: { type: number }
        publishedCount: { type: integer }
        pendingCount: { type: integer }
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    Transaction:
      type: object
      required: [id, productId, productTitle, amount, rating, status, disclosure, createdAt, kind, battleId, battleTitle, selectedParticipantName]
      properties:
        id: { type: string }
        productId: { type: ["string", "null"] }
        productTitle: { type: ["string", "null"] }
        amount: { type: number }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        status:
          type: string
          enum: [pending, paid, failed, refunded, requires_refund]
        disclosure: { type: string }
        receiptUrl: { type: ["string", "null"], format: uri }
        createdAt: { type: string, format: date-time }
        kind:
          type: string
          enum: [rating, battle]
        battleId: { type: ["string", "null"] }
        battleTitle: { type: ["string", "null"] }
        selectedParticipantName: { type: ["string", "null"] }
    BattleParticipant:
      type: object
      required: [id, name, slug, shortDescription, description, imageUrl, websiteUrl, category, location, isYcCompany, productId]
      properties:
        id: { type: string }
        productId: { type: ["string", "null"] }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        websiteUrl: { type: string }
        ycBatch: { type: ["string", "null"] }
        category: { type: string }
        location: { type: string }
        isYcCompany: { type: boolean }
    Battle:
      type: object
      required: [id, slug, title, description, category, participantA, participantB, comparisonCount, participantAPercentage, participantBPercentage, participantARating, participantBRating, participantAConfidence, participantBConfidence, status, winnerParticipantId, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        participantA:
          $ref: "#/components/schemas/BattleParticipant"
        participantB:
          $ref: "#/components/schemas/BattleParticipant"
        comparisonCount: { type: integer }
        participantAPercentage: { type: number }
        participantBPercentage: { type: number }
        participantARating: { type: integer }
        participantBRating: { type: integer }
        participantAConfidence: { type: integer, minimum: 0, maximum: 100 }
        participantBConfidence: { type: integer, minimum: 0, maximum: 100 }
        status:
          type: string
          enum: [active, completed]
        winnerParticipantId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BattleParticipantInput:
      type: object
      required: [name, shortDescription, description, websiteUrl, category, location, isYcCompany]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        shortDescription: { type: string, minLength: 10, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 1000 }
        websiteUrl: { type: string, format: uri }
        ycBatch: { type: ["string", "null"], maxLength: 20 }
        category: { type: string, minLength: 2, maxLength: 60 }
        location: { type: string, minLength: 2, maxLength: 80 }
        isYcCompany: { type: boolean }
    BattleInput:
      type: object
      required: [description, participantA, participantB]
      properties:
        description: { type: string, minLength: 20, maxLength: 500 }
        participantA:
          $ref: "#/components/schemas/BattleParticipantInput"
        participantB:
          $ref: "#/components/schemas/BattleParticipantInput"
    BattleSubmission:
      type: object
      required: [id, slug, title, status, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [pending]
        createdAt: { type: string, format: date-time }
    PerceptionSession:
      type: object
      required: [sessionToken, expiresAt]
      properties:
        sessionToken: { type: string }
        expiresAt: { type: string, format: date-time }
    PerceptionSessionInput:
      type: object
      required: [sessionToken]
      properties:
        sessionToken: { type: string, minLength: 20 }
    PerceptionSwipeInput:
      type: object
      required: [sessionToken, battleId, winnerParticipantId, requestId]
      properties:
        sessionToken: { type: string, minLength: 20 }
        battleId: { type: string }
        winnerParticipantId: { type: string }
        requestId: { type: string, minLength: 8, maxLength: 120 }
    PerceptionSwipeResult:
      type: object
      required: [comparisonCount, participantARating, participantBRating, participantAConfidence, participantBConfidence, tasteDna]
      properties:
        comparisonCount: { type: integer }
        participantARating: { type: integer }
        participantBRating: { type: integer }
        participantAConfidence: { type: integer, minimum: 0, maximum: 100 }
        participantBConfidence: { type: integer, minimum: 0, maximum: 100 }
        tasteDna:
          $ref: "#/components/schemas/TasteDna"
    TasteDna:
      type: object
      required: [comparisonCount, confidence, canShare, headline, axes, closestCompanies, completedBattleIds]
      properties:
        comparisonCount: { type: integer }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        canShare: { type: boolean }
        headline: { type: string }
        archetype: { type: string, nullable: true }
        rarityPercent: { type: integer, minimum: 0, maximum: 100, nullable: true }
        axes:
          type: array
          items:
            $ref: "#/components/schemas/PerceptionAxis"
        closestCompanies:
          type: array
          items:
            type: string
        completedBattleIds:
          type: array
          items:
            type: string
    PerceptionAxis:
      type: object
      required: [key, label, score, confidence]
      properties:
        key: { type: string }
        label: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    PerceptionWordInput:
      type: object
      required: [sessionToken, participantId, word]
      properties:
        sessionToken: { type: string, minLength: 20 }
        participantId: { type: string }
        word: { type: string, minLength: 2, maxLength: 32 }
    PerceptionWord:
      type: object
      required: [word, count]
      properties:
        word: { type: string }
        count: { type: integer }
    CompanyPerception:
      type: object
      required: [participant, rating, comparisonCount, confidence, axes, words, affinities, profileStatus]
      properties:
        participant:
          $ref: "#/components/schemas/BattleParticipant"
        rating: { type: integer }
        comparisonCount: { type: integer }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        axes:
          type: array
          items:
            $ref: "#/components/schemas/PerceptionAxis"
        words:
          type: array
          items:
            $ref: "#/components/schemas/PerceptionWord"
        affinities:
          type: array
          items:
            type: string
        profileStatus:
          type: string
          enum: [collecting, emerging]
    CompanyClaimInput:
      type: object
      required: [participantId, message]
      properties:
        participantId: { type: string }
        message: { type: string, minLength: 10, maxLength: 1000 }
    CompanyClaim:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending]
        createdAt: { type: string, format: date-time }
    PerceptionMapPoint:
      type: object
      required: [participant, x, y, cluster, confidence]
      properties:
        participant:
          $ref: "#/components/schemas/BattleParticipant"
        x: { type: number }
        y: { type: number }
        cluster: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
    BattleCheckoutInput:
      type: object
      required: [battleId, participantId, disclosureAccepted]
      properties:
        battleId: { type: string }
        participantId: { type: string }
        disclosureAccepted: { type: boolean }

